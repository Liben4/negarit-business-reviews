{% extends "admin/base.html" %}
{% from "admin/_macros.html" import csrf %}
{% block title %}Choose a new password{% endblock %}
{% block content %}
<form method="post" class="authcard">
  <p class="logo dark">Negarit <em>Business Review</em></p><h1>Choose a new password</h1>{{ csrf() }}
  <label>New password (12+ characters)<input type="password" name="password" minlength="12" required autocomplete="new-password" autofocus></label>
  <label>Repeat password<input type="password" name="password2" minlength="12" required autocomplete="new-password"></label>
  <button class="btn" type="submit">Update password</button>
</form>
{% endblock %}
