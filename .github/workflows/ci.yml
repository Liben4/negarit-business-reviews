name: CI / Migrate
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt pytest
      - name: Tests (SQLite)
        run: python -m pytest -q -W error::sqlalchemy.exc.SAWarning
      - name: Tests (PostgreSQL)
        run: python -m pytest -q -W error::sqlalchemy.exc.SAWarning
        env: { TEST_DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/test" }
      - name: Migrations apply cleanly and match the models
        env:
          FLASK_APP: app.py
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
        run: |
          python - <<'PY'
          import os, sqlalchemy as sa
          e = sa.create_engine(os.environ["DATABASE_URL"].replace("postgresql://", "postgresql+psycopg://"))
          with e.begin() as c: c.execute(sa.text("DROP SCHEMA public CASCADE; CREATE SCHEMA public;"))
          PY
          flask db upgrade && flask db check

  # Applies pending migrations to PRODUCTION on merges to main.
  # Vercel deploys the same commit in parallel, so write migrations
  # backwards-compatible (add first, remove in a later release).
  migrate-production:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production        # add required reviewers here if you want a manual gate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: flask db upgrade
        env:
          FLASK_APP: app.py
          APP_ENV: production
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}   # use the DIRECT (non-pooled) URL for DDL
        run: flask db upgrade
